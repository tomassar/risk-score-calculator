services:
  credit-score-app:
    build: .
    image: credit-score-evaluator
    container_name: credit-score-evaluator
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/root/data
      - ./web/static:/root/web/static
    environment:
      - PORT=8080
      - DB_PATH=/root/data/app.db
      - ENV=production
      - SESSION_SECRET=change-this-super-secret-key-in-production-please
      - HTTPS_ENABLED=false
    networks:
      - credit-score-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  credit-score-network:
    driver: bridge 